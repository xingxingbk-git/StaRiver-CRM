services:
  mysql:
    image: mysql:8.0.35
    container_name: stariver-crm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: stariver_crm
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "13306:3306"
    volumes:
      - stariver_crm_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-padmin123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: stariver-crm-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "admin123", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - stariver_crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  stariver_crm_mysql_data:
  stariver_crm_redis_data:
